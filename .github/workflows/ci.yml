name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Syntax & Integrity Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Verify Backend JavaScript Syntax
        run: |
          cd backend
          node --check src/index.js
          node --check src/workers/submissionWorker.js
          node --check src/workers/runWorker.js
          node --check src/config/queue.js
          node --check src/controllers/userSubmission.js

  frontend-ci:
    name: Frontend CI (Build Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Vite Build Check
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://codingplatefrom.onrender.com
